name: Vertex qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-gemini:
    if: vars.HOUNDSCRAPER_GCP_WIF != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: '3.12'}
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.HOUNDSCRAPER_GCP_WIF }}
          service_account: ${{ vars.HOUNDSCRAPER_GCP_SERVICE_ACCOUNT }}
      - run: pip install -r requirements.lock && pip install '.[vertex]'
      - name: Verify real output and reasoning-token counters
        env:
          HOUNDSCRAPER_GCP_MODEL: ${{ vars.HOUNDSCRAPER_GCP_MODEL }}
          HOUNDSCRAPER_VERTEX_PROJECT: ${{ vars.HOUNDSCRAPER_GCP_PROJECT }}
        run: python scripts/verify-vertex.py
