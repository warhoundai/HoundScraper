name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with: {python-version: '3.12'}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: {node-version: '22'}
      - run: npm ci && npm run typecheck && npm run build
        working-directory: dashboard
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: pip-audit --strict -r requirements-dev.lock && python scripts/audit-source.py
      - run: python -c "import os,houndscraper; assert os.environ['GITHUB_REF_NAME']=='v'+houndscraper.__version__"
      - run: python -m build && cd dist && sha256sum * > SHA256SUMS
      - name: Publish artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *rc* || "$GITHUB_REF_NAME" == *dev* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "HoundScraper $GITHUB_REF_NAME" --notes-file CHANGELOG.md "${flags[@]}" dist/*
